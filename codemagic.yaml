workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: codemagicfresh

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: ca.windaily.app

      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Build IPA with auto-incremented build number
        script: |
          echo "PROJECT_BUILD_NUMBER from Codemagic: $PROJECT_BUILD_NUMBER"
          NEXT_BUILD_NUMBER=$(($PROJECT_BUILD_NUMBER + 1))
          echo "Using NEXT_BUILD_NUMBER=$NEXT_BUILD_NUMBER"

          flutter build ipa --release \
            --build-name=1.0.$NEXT_BUILD_NUMBER \
            --build-number=$NEXT_BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - hello@windaily.ca
        notify:
          success: true
          failure: true
