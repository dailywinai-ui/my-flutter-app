workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: codemagicfresh
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ca.windaily.app
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        APP_ID: 6755403321
        SUPABASE_URL: "https://vmjcsflnqoqqvlmqnnyk.supabase.co"
        SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtamNzZmxucW9xcXZsbXFubnlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1NjUzNDcsImV4cCI6MjA3NDE0MTM0N30.n5kHPhFjIBXic3pIHSk7sVa1xpzHfEYH5kpgTqMNu58"
      flutter: stable
      xcode: 16.3
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Increment build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_ID") + 1))
          echo "Setting build number to $BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Runner/Info.plist
      - name: Generate Flutter xcconfig files
        script: |
          flutter build ios --config-only --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --config "Release"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - hello@windaily.ca
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-workflow:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        SUPABASE_URL: "https://vmjcsflnqoqqvlmqnnyk.supabase.co"
        SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtamNzZmxucW9xcXZsbXFubnlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1NjUzNDcsImV4cCI6MjA3NDE0MTM0N30.n5kHPhFjIBXic3pIHSk7sVa1xpzHfEYH5kpgTqMNu58"
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="https://vmjcsflnqoqqvlmqnnyk.supabase.co" \
            --dart-define=SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtamNzZmxucW9xcXZsbXFubnlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1NjUzNDcsImV4cCI6MjA3NDE0MTM0N30.n5kHPhFjIBXic3pIHSk7sVa1xpzHfEYH5kpgTqMNu58"
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - hello@windaily.ca
        notify:
          success: true
          failure: true