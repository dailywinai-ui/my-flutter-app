    <!-- Magnifying glass -->
    <circle cx="25" cy="22" r="10" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="25" y1="12" x2="25" y2="7" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="31.5" y1="28.5" x2="36" y2="33" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
