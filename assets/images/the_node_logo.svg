<svg width="220" height="60" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Magnifying glass icon (white on sage green circle) -->
  <g transform="translate(10, 10)">
    <!-- Background circle -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="#6B8B7F"/>
    <!-- Magnifying glass -->
    <circle cx="20" cy="18" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="20" y1="10" x2="20" y2="6" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25.5" y1="23.5" x2="29" y2="27" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Win Daily text -->
  <text x="65" y="38" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="24" font-weight="600" fill="#374B43" letter-spacing="-0.5">
    Win Daily
  </text>
</svg>
