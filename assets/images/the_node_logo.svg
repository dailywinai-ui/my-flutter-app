<svg width="180" height="50" viewBox="0 0 180 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Magnifying glass icon (larger) -->
  <g transform="translate(5, 5)">
    <!-- Background circle -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="#6B8B7F"/>
    <!-- Magnifying glass -->
    <circle cx="20" cy="18" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="20" y1="10" x2="20" y2="6" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25.5" y1="23.5" x2="29" y2="27" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Win Daily text (aligned vertically with icon) -->
  <text x="55" y="33" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="20" font-weight="600" fill="#374B43">
    Win Daily
  </text>
</svg>
