<svg width="200" height="70" viewBox="0 0 200 70" xmlns="http://www.w3.org/2000/svg">
  <!-- Magnifying glass icon (bigger) -->
  <g transform="translate(5, 10)">
    <!-- Background rounded square -->
    <rect x="0" y="0" width="50" height="50" rx="12" fill="#6B8B7F"/>
    <!-- Magnifying glass -->
    <circle cx="25" cy="22" r="10" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="25" y1="12" x2="25" y2="7" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="31.5" y1="28.5" x2="36" y2="33" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Win Daily text (bigger font) -->
  <text x="65" y="45" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="26" font-weight="600" fill="#374B43">
    Win Daily
