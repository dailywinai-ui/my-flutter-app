<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Central hub -->
  <circle cx="40" cy="40" r="8" fill="#7A9D8E"/>
  <!-- Category tags as connected nodes -->
  <circle cx="15" cy="20" r="5" fill="#B8CFC7"/>
  <circle cx="65" cy="20" r="5" fill="#B8CFC7"/>
  <circle cx="15" cy="60" r="5" fill="#B8CFC7"/>
  <circle cx="65" cy="60" r="5" fill="#B8CFC7"/>
  <!-- Connections -->
  <line x1="40" y1="40" x2="15" y2="20" stroke="#E8F0ED" stroke-width="1.5" opacity="0.4"/>
  <line x1="40" y1="40" x2="65" y2="20" stroke="#E8F0ED" stroke-width="1.5" opacity="0.4"/>
  <line x1="40" y1="40" x2="15" y2="60" stroke="#E8F0ED" stroke-width="1.5" opacity="0.4"/>
  <line x1="40" y1="40" x2="65" y2="60" stroke="#E8F0ED" stroke-width="1.5" opacity="0.4"/>
</svg>
